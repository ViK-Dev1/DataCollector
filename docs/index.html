<!DOCTYPE html>
<html>
<head>
	<title>Cool css effects</title>
</head>
<body>
	<div class='page'>
		<h1 class='clear-h1'>The Image Slider</h1>
		<section class='container'>
			<div class='slider-wrapper'>
				<div class='slider'>
					<img id='slide-1' src='./style1/bmw.jpg' alt='bmw'/>
					<img id='slide-2' src='./style1/RR.jpg' alt='rolls royce'/>
					<img id='slide-3' src='./style1/audiq8.jpg' alt='audiq8'/>
					<img id='slide-4' src='./style1/urus.jpg' alt='urus'/>
				</div>
				<div class='slider-nav'>
					<a href="#slide-1"></a>
					<a href="#slide-2"></a>
					<a href="#slide-3"></a>
					<a href="#slide-4"></a>
				</div>
			</div>
		</section>	
	</div>
	
	<div class='page'>
		<h1 class='clear-h1'>Solid Navigation Bar</h1>
		<div id='wrapper1'>
			<div class='tabs'>
				<input type="radio" name="tabs" checked id='tab1'>
				<label for='tab1' class='labelNavBar'>Home</label>
				<input type="radio" name="tabs" id='tab2'>
				<label for='tab2' class='labelNavBar'>Orders</label>
				<input type="radio" name="tabs" id='tab3'>
				<label for='tab3' class='labelNavBar'>Products</label>
				<input type="radio" name="tabs" id='tab4'>
				<label for='tab4' class='labelNavBar'>Users</label>
				<input type="radio" name="tabs" id='tab5'>
				<label for='tab5' class='labelNavBar'>Shop Settings</label>
				<div class='glider'></div>
			</div>
		</div>	
	</div>

	<link rel="stylesheet" type="text/css" href="style.css">
</body>
</html>
